<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>thumb</title>
<style>
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background: #e9d9c3 url("../web/assets/steam.webp") center 30% / cover no-repeat; }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, rgba(255,250,243,.96) 0%, rgba(255,250,243,.9) 38%, rgba(255,250,243,.55) 100%); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
  .mark { width: 220px; height: 220px; border-radius: 56px; background: linear-gradient(135deg, #f07a2c, #f5a623); display: grid; place-items: center; box-shadow: 0 40px 80px -30px rgba(240,122,44,.6), 0 0 0 10px rgba(255,255,255,.55); }
  .mark svg { width: 120px; height: 120px; stroke: #fff; fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .name { margin-top: 44px; font-size: 112px; font-weight: 800; letter-spacing: -.035em; color: #1e1b2e; line-height: 1; }
  .sub { margin-top: 22px; font-size: 34px; font-weight: 600; color: #4a4560; letter-spacing: -.01em; }
  .sub b { color: #f07a2c; font-weight: 700; }
</style></head>
<body>
  <div class="bg"></div><div class="veil"></div>
  <div class="wrap">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div class="name">Operator</div>
    <div class="sub">The <b>AI agent</b> that watches Brightspace for you</div>
  </div>
</body></html>
