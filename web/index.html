<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass Telegraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Nixie+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1118;
  --glass: rgba(20, 17, 14, .88);
  --card: rgba(255, 255, 255, .035);
  --card-hi: rgba(255, 255, 255, .06);
  --line: rgba(222, 170, 110, .18);
  --line-hi: rgba(222, 170, 110, .42);
  --copper: #d9a860;
  --glow: #ff9a3c;
  --glow-2: #ff5e3a;
  --text: #f4ebdd;
  --text-2: #cdbfa8;
  --muted: #8f826f;
  --red: #ff5a3c;
  --r-lg: 22px; --r: 16px; --r-sm: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--text);
  font: 16px/1.5 Inter, system-ui, sans-serif;
  background: radial-gradient(1200px 700px at 50% -10%, #223042 0%, var(--bg) 60%), var(--bg);
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
h1, h2, h3 { font-family: Outfit, Inter, sans-serif; margin: 0; }

/* ---------- gears ---------- */
#gears { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#gears svg { position: absolute; overflow: visible; will-change: transform; animation: spin var(--d) linear infinite; }
#gears svg.rev { animation-direction: reverse; }
#gears svg.back { filter: blur(1.8px) brightness(.42) saturate(1.1); }
#gears svg.front { filter: drop-shadow(0 24px 30px rgba(0,0,0,.7)); }
@keyframes spin { to { transform: rotate(360deg); } }
.vignette { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(5,8,12,.75) 100%); }

/* ---------- machine ---------- */
.machine {
  position: relative; z-index: 1; max-width: 1180px; margin: 40px auto 60px; padding: 28px 30px 34px;
  background: var(--glass); backdrop-filter: blur(18px) saturate(1.1); -webkit-backdrop-filter: blur(18px) saturate(1.1);
  border: 1px solid var(--line-hi); border-radius: var(--r-lg);
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,225,180,.14);
}
.rivet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe3ae, #b07c3e 50%, #4a2e14); box-shadow: 0 1px 2px rgba(0,0,0,.8); }

/* top row */
.top { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
.knob {
  flex: none; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--glow);
  background: radial-gradient(circle at 40% 32%, #3a2a1c, #140f0b 72%);
  border: 2px solid var(--copper);
  box-shadow: 0 0 0 5px rgba(0,0,0,.45), 0 0 30px rgba(255,150,60,.28), inset 0 2px 4px rgba(255,220,170,.18), inset 0 -4px 8px rgba(0,0,0,.6);
  transition: box-shadow .2s, transform .6s cubic-bezier(.2,.8,.2,1);
}
.knob:hover { box-shadow: 0 0 0 5px rgba(0,0,0,.45), 0 0 40px rgba(255,150,60,.5), inset 0 2px 4px rgba(255,220,170,.18), inset 0 -4px 8px rgba(0,0,0,.6); }
.knob:active { transform: rotate(90deg); }
.knob svg { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(255,160,70,.9)); }
.tube {
  flex: 1; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 12px 0 26px; border-radius: 30px;
  background: rgba(0,0,0,.42); border: 1.5px solid var(--copper);
  box-shadow: 0 0 26px rgba(255,160,70,.22), inset 0 3px 10px rgba(0,0,0,.7);
  transition: box-shadow .2s;
}
.tube:focus-within { box-shadow: 0 0 36px rgba(255,160,70,.42), inset 0 3px 10px rgba(0,0,0,.7); }
.tube input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: 500 18px Inter, sans-serif; }
.tube input::placeholder { color: var(--muted); }
.tube svg { width: 22px; height: 22px; color: var(--text-2); margin-right: 8px; }

/* nav */
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.tile {
  position: relative; height: 112px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  font: 600 17px/1 Outfit, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2);
  background: var(--card); border: 1px solid var(--line);
  transition: background .2s, border-color .2s, color .2s, box-shadow .2s, transform .15s;
}
.tile:hover { background: var(--card-hi); border-color: var(--line-hi); transform: translateY(-1px); }
.tile svg { width: 38px; height: 38px; color: var(--copper); transition: color .2s, filter .2s; }
.tile.on {
  color: #fff6ea; border-color: rgba(255,175,95,.75);
  background: radial-gradient(ellipse 80% 90% at 50% 20%, rgba(255,150,60,.55), rgba(150,65,20,.28) 60%, rgba(60,30,15,.2));
  box-shadow: 0 0 46px rgba(255,140,50,.32), inset 0 1px 0 rgba(255,230,190,.35);
}
.tile.on svg { color: #fff1dc; filter: drop-shadow(0 0 10px rgba(255,170,80,.9)); }

/* grid + panels */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
.panel { grid-column: span var(--c, 12); min-width: 0; padding: 26px 28px 28px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
.label { display: block; margin: 0 0 18px; font: 600 12px/1 Outfit, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.label b { color: var(--copper); font-weight: 600; }
.empty { color: var(--muted); font-size: 15px; }

/* hero */
.hero { display: grid; gap: 22px; }
.hero h1 { font: 800 clamp(34px, 4vw, 48px)/1.05 Outfit, sans-serif; letter-spacing: -.01em; color: #fff6ea; }
.hero h1 small { display: block; margin-top: 8px; font: 500 18px/1.3 Inter, sans-serif; letter-spacing: 0; color: var(--text-2); }
.hero h1 small b { color: var(--copper); font-weight: 600; }
.nixies { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.nx-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.nx-row { display: flex; gap: 5px; }
.nx {
  width: 48px; height: 78px; border-radius: 24px 24px 8px 8px; display: grid; place-items: center; position: relative;
  font: 58px/1 "Nixie One", monospace; color: #ffb35a;
  text-shadow: 0 0 4px #ff7a1a, 0 0 12px #ff6a00, 0 0 26px rgba(255,90,0,.6);
  background: radial-gradient(ellipse at 50% 42%, rgba(255,120,30,.16), transparent 70%), linear-gradient(90deg, #0d0906, #241911 32%, #15100a 70%, #0a0705);
  box-shadow: inset 0 0 0 1px rgba(255,220,180,.14), 0 0 0 2px #2c2015, 0 0 0 3px rgba(217,168,96,.6), 0 8px 16px rgba(0,0,0,.6);
}
.nx::after { content: ""; position: absolute; top: 6px; left: 9px; width: 8px; height: 42px; border-radius: 6px; background: linear-gradient(180deg, rgba(255,255,255,.2), transparent); }
.nx-cap { font: 600 11px Outfit, sans-serif; letter-spacing: .26em; color: var(--muted); }
.colon { font: 46px "Nixie One"; color: #ff9a3c; text-shadow: 0 0 10px #ff6a00; padding-bottom: 30px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cta {
  display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 22px; border-radius: 23px; text-decoration: none;
  font: 600 15px Outfit, sans-serif; letter-spacing: .02em; color: #fff;
  background: linear-gradient(90deg, var(--glow), var(--glow-2));
  box-shadow: 0 8px 26px rgba(255,120,50,.35), inset 0 1px 0 rgba(255,255,255,.3);
  transition: transform .15s, box-shadow .2s;
}
.cta:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(255,120,50,.5), inset 0 1px 0 rgba(255,255,255,.3); }
.cta svg { width: 18px; height: 18px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid var(--line-hi); color: var(--text-2); font-size: 15px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.orders { padding: 2px 0 0 18px; border-left: 2px solid var(--line-hi); color: var(--text-2); font-size: 15px; line-height: 1.55; white-space: pre-line; max-width: 62ch; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* gauge */
.gauge-wrap { display: flex; flex-direction: column; align-items: center; position: relative; }
.gauge { width: 100%; max-width: 240px; }
.gauge-state { margin-top: 2px; font: 700 22px Outfit, sans-serif; letter-spacing: .02em; color: #fff6ea; }
.gauge-state.hot { color: #ff8a66; text-shadow: 0 0 14px rgba(255,90,40,.6); }
.gauge-sub { color: var(--muted); font-size: 14px; text-align: center; }
.steam { position: absolute; top: 14%; width: 26px; height: 26px; border-radius: 50%; background: rgba(235,235,235,.5); filter: blur(7px); opacity: 0; animation: puff 2.6s ease-out infinite; }
@keyframes puff { 0% { transform: translate(0,0) scale(.5); opacity: .9; } 100% { transform: translate(var(--dx, -14px), -90px) scale(3); opacity: 0; } }
.forecast { display: grid; grid-template-columns: repeat(14, 1fr); gap: 5px; margin-top: 22px; width: 100%; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.vial { width: 100%; max-width: 14px; height: 54px; border-radius: 7px; background: rgba(0,0,0,.4); border: 1px solid var(--line); position: relative; overflow: hidden; }
.vial i { position: absolute; left: 2px; right: 2px; bottom: 2px; border-radius: 5px; background: linear-gradient(180deg, #ffd08a, #ff9a3c); box-shadow: 0 0 10px rgba(255,150,60,.8); }
.vial i.hot { background: linear-gradient(180deg, #ffab8a, var(--red)); box-shadow: 0 0 12px rgba(255,70,40,.8); }
.day span { font: 600 11px Outfit, sans-serif; color: var(--muted); }
.day.today span { color: var(--copper); }

/* rows (deadlines) */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  position: relative; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 16px 12px 12px; border-radius: var(--r-sm); background: rgba(255,255,255,.025); border: 1px solid transparent;
  transition: background .15s, border-color .15s;
}
.row:hover { background: var(--card-hi); border-color: var(--line); }
.row.hot { border-color: rgba(255,90,60,.45); background: rgba(255,90,60,.08); }
.ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--copper); border: 1px solid var(--line-hi); background: rgba(0,0,0,.3); }
.ico svg { width: 20px; height: 20px; }
.row.hot .ico { color: #ff8a66; border-color: rgba(255,120,90,.6); }
.row h3 { font: 600 17px/1.2 Outfit, sans-serif; color: #fff6ea; }
.row .meta, .card .meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.row .when { text-align: right; }
.row .when b { display: block; font: 700 16px Outfit, sans-serif; color: var(--copper); }
.row.hot .when b { color: #ff8a66; }
.row .when small { color: var(--muted); font-size: 13px; }
.row a { position: absolute; inset: 0; border-radius: var(--r-sm); }

/* courses */
.chips { display: flex; flex-direction: column; gap: 10px; }
.chip {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: var(--r-sm); text-align: left;
  background: rgba(255,255,255,.025); border: 1px solid transparent; transition: background .15s, border-color .15s, box-shadow .15s;
}
.chip:hover { background: var(--card-hi); border-color: var(--line); }
.chip.on { border-color: rgba(255,175,95,.6); background: rgba(255,150,60,.12); box-shadow: 0 0 22px rgba(255,140,50,.18); }
.chip svg { width: 22px; height: 22px; color: var(--copper); flex: none; }
.chip .nm { flex: 1; min-width: 0; }
.chip .nm b { display: block; font: 600 16px Outfit, sans-serif; color: #fff6ea; }
.chip .nm small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { flex: none; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; display: grid; place-items: center; font: 600 13px Outfit, sans-serif; color: var(--copper); border: 1px solid var(--line-hi); }

/* wire */
.wire { display: flex; flex-direction: column; gap: 12px; }
.msg { padding: 12px 14px; border-radius: var(--r-sm); background: rgba(255,255,255,.025); border-left: 2px solid var(--line-hi); }
.msg header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.tag { font: 600 10px Outfit, sans-serif; letter-spacing: .14em; padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line-hi); color: var(--copper); }
.tag.sent { color: #ffb08f; border-color: rgba(255,120,90,.5); }
.msg p { margin: 0; font: 500 13.5px/1.5 Inter, sans-serif; letter-spacing: .03em; color: var(--text-2); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.card { padding: 20px 16px 18px; border-radius: var(--r-sm); background: rgba(255,255,255,.025); border: 1px solid var(--line); text-align: center; transition: background .15s, border-color .15s; }
.card:hover { background: var(--card-hi); border-color: var(--line-hi); }
.card .ico { margin: 0 auto 12px; width: 50px; height: 50px; }
.card h3 { font: 600 16px/1.25 Outfit, sans-serif; color: #fff6ea; }
.card .big { margin-top: 10px; font: 34px/1 "Nixie One"; color: #ffb35a; text-shadow: 0 0 10px #ff6a00; }
.card .big small { font: 600 11px Outfit, sans-serif; letter-spacing: .22em; color: var(--muted); text-shadow: none; margin-left: 4px; }

.view[hidden] { display: none; }

@media (max-width: 960px) {
  .machine { margin: 14px 14px 30px; padding: 18px 16px 22px; }
  .knob { width: 50px; height: 50px; } .knob svg { width: 22px; height: 22px; }
  .tube { height: 50px; padding-left: 18px; } .tube input { font-size: 16px; }
  .nav { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile { height: 84px; font-size: 14px; gap: 6px; } .tile svg { width: 28px; height: 28px; }
  .panel { --c: 12 !important; padding: 20px 18px 22px; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .nx { width: 34px; height: 56px; font-size: 40px; border-radius: 17px 17px 6px 6px; } .colon { font-size: 32px; padding-bottom: 24px; }
  .row { grid-template-columns: 40px 1fr; } .row .when { grid-column: 2; text-align: left; } .ico { width: 40px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) { #gears svg, .colon, .steam { animation: none; } }
</style>
</head>
<body>
<div id="gears"></div><div class="vignette"></div>

<main class="machine">
  <span class="rivet" style="top:10px;left:10px"></span><span class="rivet" style="top:10px;right:10px"></span>
  <span class="rivet" style="bottom:10px;left:10px"></span><span class="rivet" style="bottom:10px;right:10px"></span>

  <div class="top">
    <button class="knob" title="Refresh" onclick="load()"><svg viewBox="0 0 24 24"><path id="gearIcon" fill="currentColor" fill-rule="evenodd"/></svg></button>
    <label class="tube">
      <input id="q" placeholder="Ask the telegraph… try HW, quiz, EST 393" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    </label>
    <button class="knob" title="Search" onclick="document.getElementById('q').focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </div>

  <nav class="nav" id="nav">
    <button class="tile on" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg>Station</button>
    <button class="tile" data-view="deadlines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15.5l2 2 4-4"/></svg>Deadlines</button>
    <button class="tile" data-view="telegrams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4z"/><path d="M8 9.5h8M8 13h5"/></svg>Telegrams</button>
    <button class="tile" data-view="boiler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 17 4-5"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/></svg>Boiler</button>
  </nav>

  <section class="view" id="view-home">
    <div class="grid">
      <div class="panel hero" style="--c:8" id="hero"></div>
      <div class="panel" style="--c:4"><span class="label">Boiler pressure · <b>72h</b></span><div id="boiler"></div></div>
      <div class="panel" style="--c:5"><span class="label">Up next</span><div class="rows" id="next"></div></div>
      <div class="panel" style="--c:4"><span class="label">Courses</span><div class="chips" id="courses"></div></div>
      <div class="panel" style="--c:3"><span class="label">The wire</span><div class="wire" id="wire"></div></div>
      <div class="panel" style="--c:12"><span class="label">On the line</span><div class="cards" id="cards"></div></div>
    </div>
  </section>
  <section class="view" id="view-deadlines" hidden><div class="panel"><span class="label">Every upcoming deadline</span><div class="rows" id="all"></div></div></section>
  <section class="view" id="view-telegrams" hidden><div class="panel"><span class="label">Telegram archive</span><div class="wire" id="wireAll" style="max-width:620px"></div></div></section>
  <section class="view" id="view-boiler" hidden><div class="panel"><span class="label">Boiler pressure · <b>72h</b></span><div id="boilerBig"></div></div></section>
</main>

<script>
const ET = "America/New_York";
const WEIGHT = { exam: 4, quiz: 2, assignment: 2, discussion: 1, content: 0, other: 1 };
const MAX_LOAD = 8;
let state = { items: [], telegrams: [], now: new Date().toISOString() };
let courseFilter = null, clockOffset = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const code = c => (c.match(/^[A-Z]{3}\s\d{3}/) || [c.split(" - ")[0]])[0];
const courseName = c => c.replace(/^[A-Z]{3}\s[\d.]+\s*/, "").replace(/\s*-\s*(Fall|Spring|Summer|Winter)\s\d{4}$/, "");
const now = () => Date.now() + clockOffset;
const fmt = (iso, o = {}) => new Date(iso).toLocaleString("en-US", { timeZone: ET, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", ...o });
function left(iso) {
  const h = (Date.parse(iso) - now()) / 3.6e6;
  if (h < 1) return `${Math.max(0, Math.round(h * 60))} min left`;
  if (h < 48) return `${Math.round(h)} hours left`;
  return `${Math.round(h / 24)} days left`;
}
const KIND_ICON = {
  assignment: '<path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7M9 17h5"/>',
  discussion: '<path d="M4 5h12v8H9l-5 4z M10 16h6l4 3v-9h-2"/>',
  quiz: '<circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5M12 16.5v.5"/>',
  exam: '<path d="M12 3 3 8l9 5 9-5z M7 10.5V15c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5"/>',
  content: '<path d="M4 5h7v14H4z M13 5h7v14h-7z"/>',
  other: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${KIND_ICON[k] || KIND_ICON.other}</svg>`;

function gearPath(teeth, ro, ri, hole, cx = 0, cy = 0) {
  let d = "";
  const step = Math.PI * 2 / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    for (const [r, t] of [[ri, a], [ro, a + step * .16], [ro, a + step * .42], [ri, a + step * .58]])
      d += (d ? "L" : "M") + (cx + r * Math.cos(t)).toFixed(2) + "," + (cy + r * Math.sin(t)).toFixed(2);
  }
  return d + `ZM${cx + hole},${cy}A${hole},${hole} 0 1,0 ${cx - hole},${cy}A${hole},${hole} 0 1,0 ${cx + hole},${cy}Z`;
}

/* Metallic gears: specular-lit SVG, two depth layers, meshing speeds (duration ∝ teeth). */
function drawGears() {
  const METALS = {
    copper: ["#e0945c", "#a85a2e", "#4a2512"],
    brass: ["#f0c070", "#b8863c", "#5a3c14"],
    bronze: ["#b07a4c", "#6e4424", "#2e1a0c"]
  };
  // [side, x, y, size, teeth, metal, layer, reverse]
  const spots = [
    ["l", -170, -190, 520, 26, "copper", "front", 0], ["l", 190, 90, 190, 11, "brass", "front", 1],
    ["l", -230, 400, 470, 24, "bronze", "back", 1], ["l", 60, 640, 230, 13, "copper", "front", 0],
    ["l", -140, 900, 400, 20, "brass", "back", 0],
    ["r", -190, -130, 500, 25, "brass", "front", 1], ["r", 170, 240, 200, 11, "copper", "front", 0],
    ["r", -260, 480, 540, 28, "copper", "back", 0], ["r", 90, 780, 240, 13, "bronze", "front", 1],
    ["r", -120, 960, 380, 19, "brass", "back", 1]
  ];
  $("gears").innerHTML = spots.map(([side, x, y, size, teeth, metal, layer, rev], i) => {
    const r = size / 2, [hi, mid, lo] = METALS[metal];
    const spokes = Array.from({ length: 6 }, (_, k) => {
      const a = k * Math.PI / 3, w = r * .09;
      const p = (rr, t) => `${(rr * Math.cos(t)).toFixed(1)},${(rr * Math.sin(t)).toFixed(1)}`;
      return `<path d="M${p(r * .2, a - w / (r * .2))} L${p(r * .7, a - w / (r * .7))} L${p(r * .7, a + w / (r * .7))} L${p(r * .2, a + w / (r * .2))}Z"/>`;
    }).join("");
    return `<svg class="${layer} ${rev ? "rev" : ""}" style="${side === "l" ? "left" : "right"}:${x}px;top:${y}px;width:${size}px;height:${size}px;--d:${teeth * 4.5}s" viewBox="${-r} ${-r} ${size} ${size}">
      <defs>
        <radialGradient id="m${i}" cx="32%" cy="26%" r="95%"><stop offset="0" stop-color="${hi}"/><stop offset=".45" stop-color="${mid}"/><stop offset="1" stop-color="${lo}"/></radialGradient>
        <linearGradient id="s${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
        <filter id="f${i}" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="${(r * .02).toFixed(1)}" result="b"/>
          <feSpecularLighting in="b" surfaceScale="${(r * .06).toFixed(1)}" specularConstant=".75" specularExponent="18" lighting-color="#ffe6c0" result="sp"><fePointLight x="${-r * 1.2}" y="${-r * 1.6}" z="${r * 1.4}"/></feSpecularLighting>
          <feComposite in="sp" in2="SourceAlpha" operator="in" result="sp2"/>
          <feComposite in="SourceGraphic" in2="sp2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
        </filter>
      </defs>
      <g filter="url(#f${i})" fill="url(#m${i})" stroke="${lo}" stroke-width="${(r * .012).toFixed(1)}">
        <path fill-rule="evenodd" d="${gearPath(teeth, r * .98, r * .86, r * .72)}"/>
        ${spokes}
        <circle r="${r * .22}"/>
      </g>
      <g fill="url(#s${i})"><path fill-rule="evenodd" d="${gearPath(teeth, r * .98, r * .86, r * .72)}"/><circle r="${r * .22}"/></g>
      <circle r="${r * .08}" fill="${lo}"/>
      <circle r="${r * .79}" fill="none" stroke="${hi}" stroke-opacity=".25" stroke-width="1"/>
      ${Array.from({ length: 6 }, (_, k) => { const a = k * Math.PI / 3 + Math.PI / 6; return `<circle cx="${(r * .79 * Math.cos(a)).toFixed(1)}" cy="${(r * .79 * Math.sin(a)).toFixed(1)}" r="${r * .025}" fill="${lo}"/>`; }).join("")}
    </svg>`;
  }).join("");
  $("gearIcon").setAttribute("d", gearPath(9, 11, 8.4, 3.2, 12, 12));
}

/* ---------- data ---------- */
const matches = i => { const q = $("q").value.trim().toLowerCase(); return !q || `${i.title} ${i.course} ${i.kind}`.toLowerCase().includes(q); };
function upcoming(days = 365, filtered = true) {
  const n = now(), end = n + days * 864e5;
  return state.items.filter(i => i.isDue && Date.parse(i.due) >= n && Date.parse(i.due) <= end && (!filtered || ((!courseFilter || i.course === courseFilter) && matches(i))));
}
function currentCourses() {
  const m = new Map();
  for (const i of upcoming(365, false)) if (/^[A-Z]{3}\s\d{3}/.test(i.course)) m.set(i.course, (m.get(i.course) || 0) + 1);
  return [...m].sort((a, b) => a[0].localeCompare(b[0]));
}
const loadBetween = (s, e) => state.items.filter(i => i.isDue && Date.parse(i.due) >= s && Date.parse(i.due) < e).reduce((a, i) => a + (WEIGHT[i.kind] ?? 1), 0);
function etMidnight(ms) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: ET, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date(ms));
  const g = t => +parts.find(p => p.type === t).value;
  return ms - ((g("hour") * 60 + g("minute")) * 60 + g("second")) * 1000 - (ms % 1000);
}
function orders(i) {
  return i.description.split("\n").map(l => l.trim())
    .filter(l => l && !/https?:\/\//.test(l) && !/^(Assignments|Discussions|Quizzes|Materials|Modules):$/i.test(l))
    .join("\n");
}

/* ---------- views ---------- */
function heroHtml() {
  const i = upcoming(365)[0];
  if (!i) return `<span class="label">Next on the wire</span><p class="empty">The line is quiet. Full steam ahead.</p>`;
  const txt = orders(i);
  return `<span class="label">Next on the wire</span>
    <h1>${esc(i.title)}<small><b>${esc(code(i.course))}</b> · ${esc(courseName(i.course))}</small></h1>
    <div class="nixies" id="nixies" data-due="${esc(i.due)}"></div>
    <div class="hero-actions">
      ${i.link ? `<a class="cta" href="${esc(i.link)}" target="_blank" rel="noopener">Open in Brightspace <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>` : ""}
      <span class="pill"><i></i>Due ${esc(fmt(i.due))}</span>
    </div>
    ${txt ? `<p class="orders">${esc(txt)}</p>` : ""}`;
}
function tickNixies() {
  const el = $("nixies"); if (!el) return;
  let s = Math.max(0, Math.floor((Date.parse(el.dataset.due) - now()) / 1000));
  const d = Math.floor(s / 86400); s %= 86400; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
  const grp = (v, cap) => `<div class="nx-group"><div class="nx-row">${String(v).padStart(2, "0").split("").map(c => `<span class="nx">${c}</span>`).join("")}</div><span class="nx-cap">${cap}</span></div>`;
  el.innerHTML = [grp(d, "DAYS"), grp(h, "HRS"), grp(m, "MIN"), grp(s, "SEC")].join(`<span class="colon">:</span>`);
}
function rowHtml(i) {
  const hot = Date.parse(i.due) - now() < 24 * 3.6e6;
  const day = new Date(i.due).toLocaleDateString("en-US", { timeZone: ET, month: "short", day: "numeric" });
  const time = new Date(i.due).toLocaleTimeString("en-US", { timeZone: ET, weekday: "short", hour: "numeric", minute: "2-digit" });
  return `<div class="row ${hot ? "hot" : ""}"><span class="ico">${icon(i.kind)}</span>
    <div><h3>${esc(i.title)}</h3><div class="meta">${esc(code(i.course))} · ${esc(i.kind)}</div></div>
    <div class="when"><b>${esc(day)}</b><small>${esc(time)} · ${left(i.due)}</small></div>
    ${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener" aria-label="Open ${esc(i.title)}"></a>` : ""}</div>`;
}

function gaugeSvg(load) {
  const pct = Math.min(1, load / MAX_LOAD), A0 = -135, A1 = 135, ang = A0 + pct * 270;
  const pt = (a, r) => { const t = (a - 90) * Math.PI / 180; return [100 + r * Math.cos(t), 100 + r * Math.sin(t)]; };
  const arc = (a, b, r) => { const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r); return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${b - a > 180 ? 1 : 0},1 ${x2.toFixed(1)},${y2.toFixed(1)}`; };
  let ticks = "";
  for (let k = 0; k <= 8; k++) {
    const a = A0 + k * 270 / 8, [x1, y1] = pt(a, 70), [x2, y2] = pt(a, 74), [tx, ty] = pt(a, 81);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,230,190,.45)" stroke-width="1.5"/>
      <text x="${tx.toFixed(1)}" y="${(ty + 3).toFixed(1)}" text-anchor="middle" font-family="Outfit" font-weight="600" font-size="8" fill="rgba(255,230,190,.55)">${k}</text>`;
  }
  const hot = pct >= .7;
  return `<svg class="gauge" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="bz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c070"/><stop offset=".5" stop-color="#9a6a36"/><stop offset="1" stop-color="#5a3c14"/></linearGradient>
      <radialGradient id="fc" cx="50%" cy="40%"><stop offset="0" stop-color="#1f1812"/><stop offset="1" stop-color="#0d0a08"/></radialGradient>
      <linearGradient id="pg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffc46a"/><stop offset="1" stop-color="${hot ? "#ff5a3c" : "#ff9a3c"}"/></linearGradient>
      <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="100" cy="100" r="96" fill="url(#bz)"/>
    <circle cx="100" cy="100" r="91" fill="#120d09"/>
    <circle cx="100" cy="100" r="88" fill="url(#fc)"/>
    <path d="${arc(A0, A1, 62)}" stroke="rgba(255,255,255,.07)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="${arc(A0 + 270 * .7, A1, 62)}" stroke="rgba(255,90,60,.3)" stroke-width="8" fill="none" stroke-linecap="round"/>
    ${pct > 0 ? `<path d="${arc(A0, ang, 62)}" stroke="url(#pg)" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#gl)"/>` : ""}
    ${ticks}
    <g style="transform:rotate(${ang}deg);transform-origin:100px 100px;transition:transform 1.4s cubic-bezier(.3,1.5,.5,1)">
      <path d="M98.6 100 L100 48 L101.4 100 Z" fill="${hot ? "#ff6a4a" : "#ffb35a"}" filter="url(#gl)"/>
    </g>
    <text x="100" y="146" text-anchor="middle" font-family="'Nixie One'" font-size="30" fill="#ffb35a" filter="url(#gl)">${load}</text>
    <text x="100" y="160" text-anchor="middle" font-family="Outfit" font-weight="600" font-size="7" letter-spacing="2.5" fill="rgba(255,230,190,.5)">UNITS / 72H</text>
    <circle cx="100" cy="100" r="6" fill="url(#bz)"/><circle cx="100" cy="100" r="2.5" fill="#120d09"/>
  </svg>`;
}
function boilerHtml() {
  const n = now(), load = loadBetween(n, n + 72 * 3.6e6), pct = load / MAX_LOAD;
  const [label, cls] = pct >= .7 ? ["Overpressure", "hot"] : pct >= .4 ? ["Building steam", ""] : ["Calm seas", ""];
  const start = etMidnight(n);
  const days = Array.from({ length: 14 }, (_, d) => {
    const s = start + d * 864e5, v = loadBetween(s, s + 864e5), mid = new Date(s + 6 * 3.6e6);
    return `<div class="day ${d === 0 ? "today" : ""}" title="${mid.toLocaleDateString("en-US", { timeZone: ET, weekday: "short", month: "short", day: "numeric" })}: load ${v}">
      <div class="vial">${v ? `<i class="${v >= 3 ? "hot" : ""}" style="height:${Math.min(100, 22 + v / 4 * 78)}%"></i>` : ""}</div><span>${mid.toLocaleDateString("en-US", { timeZone: ET, weekday: "narrow" })}</span></div>`;
  }).join("");
  const steam = pct >= .7 ? [0, .9, 1.7].map((d, k) => `<span class="steam" style="left:${44 + k * 6}%;animation-delay:${d}s;--dx:${(k - 1) * 18}px"></span>`).join("") : "";
  return `<div class="gauge-wrap">${steam}${gaugeSvg(load)}<div class="gauge-state ${cls}">${label}</div>
    <div class="gauge-sub">${load ? `${load} units of work due in the next 72 hours` : "Nothing due in the next 72 hours"}</div>
    <div class="forecast">${days}</div></div>`;
}

function queuedReminders() {
  const n = now(), out = [];
  for (const i of upcoming(7, false)) for (const h of [24, 3, 1]) {
    const at = Date.parse(i.due) - h * 3.6e6;
    if (at > n) out.push({ at, text: `${h <= 1 ? "URGENT" : h <= 3 ? "PRIORITY" : "NOTICE"} ${code(i.course)} ${i.title.toUpperCase()}. STOP. DUE IN ${h} HOUR${h > 1 ? "S" : ""}. STOP.` });
  }
  return out.sort((a, b) => a.at - b.at);
}
function wireHtml(limit) {
  const sent = state.telegrams.map(t => ({ at: Date.parse(t.at), text: t.text.replace(/^TELEGRAM:\s*/, ""), tag: t.sent ? "SENT" : "LOGGED", cls: t.sent ? "sent" : "" }));
  const queued = queuedReminders().map(q => ({ ...q, tag: "QUEUED", cls: "" }));
  const list = [...sent, ...queued.slice(0, 2)].slice(0, limit);
  if (!list.length) return `<p class="empty">No telegrams on the wire yet.</p>`;
  return list.map(t => `<div class="msg"><header><span>${esc(fmt(new Date(t.at).toISOString()))}</span><span class="tag ${t.cls}">${t.tag}</span></header><p>${esc(t.text)}</p></div>`).join("");
}

function render() {
  $("hero").innerHTML = heroHtml(); tickNixies();
  $("boiler").innerHTML = boilerHtml(); $("boilerBig").innerHTML = boilerHtml();
  const up = upcoming();
  $("next").innerHTML = up.slice(1, 4).map(rowHtml).join("") || `<p class="empty">Nothing else on the horizon.</p>`;
  $("all").innerHTML = up.map(rowHtml).join("") || `<p class="empty">No upcoming deadlines.</p>`;
  $("courses").innerHTML = currentCourses().map(([c, n]) =>
    `<button class="chip ${courseFilter === c ? "on" : ""}" data-course="${esc(c)}"><svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="${gearPath(9, 11, 8.4, 3.4, 12, 12)}"/></svg>
      <span class="nm"><b>${esc(code(c))}</b><small>${esc(courseName(c))}</small></span><span class="count">${n}</span></button>`).join("");
  $("cards").innerHTML = up.slice(0, 4).map(i => {
    const days = Math.max(0, Math.ceil((Date.parse(i.due) - now()) / 864e5));
    return `<div class="card"><span class="ico">${icon(i.kind)}</span><h3>${esc(i.title)}</h3>
      <div class="meta">${esc(code(i.course))} · ${esc(fmt(i.due, { hour: undefined, minute: undefined }))}</div>
      <div class="big">${days}<small>${days === 1 ? "DAY" : "DAYS"}</small></div></div>`;
  }).join("") || `<p class="empty">The line is quiet.</p>`;
  $("wire").innerHTML = wireHtml(3); $("wireAll").innerHTML = wireHtml(100);
}
async function load() {
  try { state = await (await fetch("/api/state")).json(); clockOffset = Date.parse(state.now) - Date.now(); } catch {}
  render();
}
$("nav").addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (!t) return;
  document.querySelectorAll(".tile").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-" + t.dataset.view);
});
$("courses").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; courseFilter = courseFilter === c.dataset.course ? null : c.dataset.course; render(); });
$("q").addEventListener("input", render);
drawGears(); load();
setInterval(tickNixies, 1000); setInterval(load, 60_000);
</script>
</body>
</html>
