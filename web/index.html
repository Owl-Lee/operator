<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass Telegraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f4ee; --bg-2: #fffdf9; --card: #ffffff;
  --ink: #1e1b2e; --ink-2: #4b4660; --muted: #8a8599; --line: #ebe6dd; --line-2: #ddd7cc;
  --accent: #ff5e3a; --accent-2: #ff9a3c;
  --deadline: #ff5e3a; --deadline-bg: #fff0eb;
  --class: #4f6bff; --class-bg: #eef1ff;
  --meeting: #9b5cff; --meeting-bg: #f4edff;
  --event: #0fa98f; --event-bg: #e6f7f3;
  --urgent: #e5372e;
  --shadow: 0 1px 2px rgba(30,27,46,.04), 0 12px 32px -12px rgba(30,27,46,.12);
  --r: 20px; --r-sm: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  color: var(--ink); background: var(--bg);
  font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(900px 500px at 15% -10%, rgba(255,154,60,.14), transparent 60%), radial-gradient(900px 500px at 90% 0%, rgba(155,92,255,.10), transparent 60%);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, .num { font-family: Outfit, Inter, sans-serif; margin: 0; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 18px; height: 72px; margin: 0 -24px; padding: 0 24px; background: rgba(247,244,238,.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(0,0,0,.04); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px Outfit, sans-serif; }
.brand i { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); display: grid; place-items: center; color: #fff; box-shadow: 0 6px 14px rgba(255,94,58,.3); }
.brand i svg { width: 16px; height: 16px; }
.tabs { display: flex; gap: 4px; margin: 0 auto; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
.tab { padding: 8px 16px; border-radius: 999px; font: 600 14px Outfit, sans-serif; color: var(--ink-2); transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--ink); color: #fff; }
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: #fff; border: 1px solid var(--line); min-width: 240px; }
.search svg { width: 16px; height: 16px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; font: 500 14px Inter, sans-serif; color: var(--ink); width: 100%; }
.search input::placeholder { color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; font: 600 14px Outfit, sans-serif; color: #fff; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px -6px rgba(255,94,58,.55); transition: transform .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { color: var(--ink); background: #fff; border: 1px solid var(--line-2); box-shadow: none; }

/* ---------- hero ---------- */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 44px 0 28px; }
.hero .kicker { font: 600 13px Outfit, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.hero h1 { font: 800 clamp(34px, 4.6vw, 52px)/1.05 Outfit, sans-serif; letter-spacing: -.02em; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 12px 0 0; color: var(--ink-2); font-size: 16px; max-width: 56ch; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.stat { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--r-sm); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.stat:hover { transform: translateY(-2px); }
.stat.on { outline: 2px solid var(--c); outline-offset: -2px; }
.stat .dot { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--cbg); color: var(--c); flex: none; }
.stat .dot svg { width: 20px; height: 20px; }
.stat .num { font: 700 26px/1 Outfit, sans-serif; }
.stat small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
.card { grid-column: span var(--c, 12); min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.card-h h2 { font: 700 19px Outfit, sans-serif; letter-spacing: -.01em; }
.card-h .more { font: 600 13px Outfit, sans-serif; color: var(--muted); }
.card-h .more:hover { color: var(--ink); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

/* kind coloring */
[data-kind="deadline"] { --c: var(--deadline); --cbg: var(--deadline-bg); }
[data-kind="class"] { --c: var(--class); --cbg: var(--class-bg); }
[data-kind="meeting"] { --c: var(--meeting); --cbg: var(--meeting-bg); }
[data-kind="event"] { --c: var(--event); --cbg: var(--event-bg); }
.kind { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font: 600 11px Outfit, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--c); background: var(--cbg); }
.kind::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.course-tag { display: inline-block; font: 600 12px Outfit, sans-serif; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.sample { font: 500 10px Inter, sans-serif; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 5px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }

/* ---------- timeline ---------- */
.tl { position: relative; padding-left: 4px; }
.tl-day { margin-bottom: 18px; }
.tl-day > h3 { font: 700 13px Outfit, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.tl-day > h3 b { color: var(--ink); }
.tl-day > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.item { position: relative; display: grid; grid-template-columns: 74px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: var(--r-sm); transition: background .15s; }
.item:hover { background: var(--bg-2); }
.item .time { font: 600 13px Outfit, sans-serif; color: var(--ink-2); line-height: 1.3; }
.item .time small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.item .body { min-width: 0; border-left: 3px solid var(--c); padding-left: 12px; }
.item .body h4 { margin: 0; font: 600 15px Outfit, sans-serif; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .body p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.item .side { display: flex; align-items: center; gap: 8px; }
.item a.cover { position: absolute; inset: 0; border-radius: var(--r-sm); }
.item.urgent .body h4 { color: var(--urgent); }

/* urgency pips */
.pip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font: 600 12px Outfit, sans-serif; }
.pip.u1 { color: #fff; background: var(--urgent); box-shadow: 0 0 0 4px rgba(229,55,46,.15); animation: pulse 1.6s ease-in-out infinite; }
.pip.u2 { color: #b43a0a; background: #ffe7d6; }
.pip.u3 { color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(229,55,46,0); } }

/* ---------- focus (next deadline) ---------- */
.focus { background: linear-gradient(160deg, #1f1b2f, #2b2140 60%, #3a1f3a); color: #fff; border: 0; position: relative; overflow: hidden; }
.focus::after { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(255,154,60,.55), transparent 65%); }
.focus .kicker { font: 600 12px Outfit, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.focus h2 { font: 800 30px/1.1 Outfit, sans-serif; margin: 8px 0 4px; }
.focus .sub { color: rgba(255,255,255,.7); font-size: 14px; }
.cd { display: flex; gap: 14px; margin: 22px 0 20px; }
.cd div { text-align: center; }
.cd b { display: block; font: 800 38px/1 Outfit, sans-serif; letter-spacing: -.02em; }
.cd small { display: block; margin-top: 4px; font: 600 11px Outfit, sans-serif; letter-spacing: .14em; color: rgba(255,255,255,.55); }
.focus .btn { position: relative; }
.focus .after { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
.focus .after .kicker { margin-bottom: 8px; }
.after-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 14px; }
.after-row:last-child { border: 0; }
.after-row span { min-width: 0; } .after-row small { display: block; color: rgba(255,255,255,.5); font-size: 12px; }
.after-row b { font: 600 13px Outfit, sans-serif; color: rgba(255,255,255,.75); white-space: nowrap; }
.focus .orders { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.78); font-size: 13.5px; line-height: 1.55; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.wd { padding: 10px 6px 12px; border-radius: 12px; text-align: center; border: 1px solid var(--line); background: var(--bg-2); }
.wd.today { background: var(--ink); color: #fff; border-color: var(--ink); }
.wd small { display: block; font: 600 11px Outfit, sans-serif; letter-spacing: .08em; opacity: .6; }
.wd b { display: block; font: 700 20px Outfit, sans-serif; margin: 2px 0 8px; }
.wd .dots { display: flex; justify-content: center; gap: 4px; min-height: 8px; flex-wrap: wrap; }
.wd .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.wd.today .dots i { outline: 1px solid rgba(255,255,255,.4); }

/* ---------- deadlines list ---------- */
.dl { display: flex; flex-direction: column; gap: 8px; }
.dl .item { grid-template-columns: 1fr auto; }
.dl .body { border: 0; padding: 0; }
.dl .date { text-align: right; font: 600 13px Outfit, sans-serif; color: var(--ink-2); }
.dl .date small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.bar { height: 6px; border-radius: 3px; background: var(--bg); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }

/* ---------- agenda cards (meetings & events) ---------- */
.ag { display: flex; flex-direction: column; gap: 10px; }
.ag .row { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: start; padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); transition: border-color .15s, transform .15s; }
.ag .row:hover { border-color: var(--line-2); transform: translateY(-1px); }
.datebox { text-align: center; border-radius: 10px; padding: 6px 0 7px; background: var(--cbg); color: var(--c); }
.datebox small { display: block; font: 700 10px Outfit, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.datebox b { display: block; font: 800 20px/1.1 Outfit, sans-serif; }
.ag h4 { margin: 0; font: 600 15px Outfit, sans-serif; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ag p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.ag .note { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--bg); color: var(--ink-2); font-size: 13px; }
.ag .mile { margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--deadline-bg); color: #b43a0a; font: 600 12.5px Outfit, sans-serif; }

/* ---------- week view ---------- */
.wk { display: grid; grid-template-columns: 56px repeat(7, 1fr); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: #fff; }
.wk .hd { padding: 10px 6px; text-align: center; font: 600 12px Outfit, sans-serif; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg-2); }
.wk .hd b { display: block; font-size: 18px; color: var(--ink); }
.wk .hd.today b { color: var(--accent); }
.wk .col { position: relative; height: 720px; border-left: 1px solid var(--line); background: repeating-linear-gradient(180deg, transparent 0 59px, var(--line) 59px 60px); }
.wk .hours { position: relative; height: 720px; }
.wk .hours span { position: absolute; right: 8px; transform: translateY(-50%); font: 500 11px Inter, sans-serif; color: var(--muted); }
.blk { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 5px 7px; font: 600 11.5px/1.25 Outfit, sans-serif; color: var(--c); background: var(--cbg); border-left: 3px solid var(--c); overflow: hidden; }
.blk small { display: block; font: 500 10.5px Inter, sans-serif; color: var(--ink-2); opacity: .8; }
.pin { position: absolute; left: 4px; right: 4px; height: 20px; border-radius: 6px; background: var(--deadline); color: #fff; font: 600 11px/20px Outfit, sans-serif; padding: 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin.u1 { background: var(--urgent); }
.allday { padding: 6px 8px; border-bottom: 1px solid var(--line); min-height: 34px; font: 600 11.5px Outfit, sans-serif; }
.allday span { display: block; padding: 3px 7px; border-radius: 6px; background: var(--cbg); color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- courses ---------- */
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.course { padding: 18px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg-2); }
.course h3 { font: 700 17px Outfit, sans-serif; }
.course p { margin: 2px 0 12px; color: var(--muted); font-size: 13px; }
.course .next { font-size: 13.5px; color: var(--ink-2); }
.course .next b { color: var(--ink); font-weight: 600; }
.course .n { float: right; font: 700 20px Outfit, sans-serif; color: var(--accent); }

.view[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 980px) {
  .wrap { padding: 0 16px 60px; }
  .nav { margin: 0 -16px; padding: 0 16px; gap: 10px; }
  .tabs { order: 3; width: 100%; margin: 0; justify-content: space-between; }
  .nav { flex-wrap: wrap; height: auto; padding-top: 10px; padding-bottom: 10px; }
  .search { display: none; }
  .hero { flex-direction: column; align-items: flex-start; padding: 28px 0 20px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .card { --c: 12 !important; padding: 18px; }
  .item { grid-template-columns: 60px 1fr; } .item .side { grid-column: 2; }
  .cd b { font-size: 30px; }
  .wk { grid-template-columns: 40px repeat(7, 1fr); font-size: 10px; }
  .blk { padding: 3px 4px; font-size: 10px; } .blk small { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <a class="brand" href="#"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/></svg></i>Brass Telegraph</a>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-view="today">Today</button>
      <button class="tab" data-view="week">Week</button>
      <button class="tab" data-view="deadlines">Deadlines</button>
      <button class="tab" data-view="courses">Courses</button>
    </nav>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Search anything…" autocomplete="off"></label>
    <button class="btn ghost" onclick="load()">Sync</button>
  </header>

  <section class="hero">
    <div>
      <div class="kicker" id="kicker">—</div>
      <h1 id="greeting">Good evening, <span>Lee</span>.</h1>
      <p id="summary">Loading your week…</p>
    </div>
    <a class="btn" href="#" id="openNext" target="_blank" rel="noopener">Open next item →</a>
  </section>

  <div class="stats" id="stats"></div>

  <section class="view" id="view-today">
    <div class="grid">
      <div class="card" style="--c:8"><div class="card-h"><h2>Timeline</h2><a class="more" href="#" data-go="week">Full week →</a></div><div class="tl" id="timeline"></div></div>
      <div class="card focus" style="--c:4" id="focus"></div>
      <div class="card" style="--c:12"><div class="card-h"><h2>This week</h2><span class="more" id="weekRange"></span></div><div class="week" id="weekstrip"></div></div>
      <div class="card" style="--c:6"><div class="card-h"><h2>Deadlines</h2><a class="more" href="#" data-go="deadlines">All →</a></div><div class="dl" id="deadlines"></div></div>
      <div class="card" style="--c:6"><div class="card-h"><h2>Meetings &amp; events</h2><span class="more" id="agCount"></span></div><div class="ag" id="agenda"></div></div>
    </div>
  </section>

  <section class="view" id="view-week" hidden>
    <div class="card"><div class="card-h"><h2>Week view</h2><span class="more" id="weekRange2"></span></div><div class="wk" id="wk"></div></div>
  </section>

  <section class="view" id="view-deadlines" hidden>
    <div class="card"><div class="card-h"><h2>Every upcoming deadline</h2></div><div class="dl" id="deadlinesAll"></div></div>
  </section>

  <section class="view" id="view-courses" hidden>
    <div class="card"><div class="card-h"><h2>Courses</h2></div><div class="courses" id="courses"></div></div>
  </section>
</div>

<script>
const ET = "America/New_York";
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
let state = { items: [], schedule: { classes: [], meetings: [], events: [] }, now: new Date().toISOString() };
let clockOffset = 0, kindFilter = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const code = c => (c?.match(/^[A-Z]{3}\s\d{3}/) || [c?.split(" - ")[0] || ""])[0];
const courseName = c => (c || "").replace(/^[A-Z]{3}\s[\d.]+\s*/, "").replace(/\s*-\s*(Fall|Spring|Summer|Winter)\s\d{4}$/, "");
const now = () => Date.now() + clockOffset;
const fmt = (ms, o) => new Date(ms).toLocaleString("en-US", { timeZone: ET, ...o });
const timeOf = ms => fmt(ms, { hour: "numeric", minute: "2-digit" }).replace(":00", "");
const H = 3.6e6, D = 864e5;

/* ---- ET date helpers (events are stored in ET local time) ---- */
function etParts(ms) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: ET, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23", weekday: "short" }).formatToParts(new Date(ms));
  const g = t => p.find(x => x.type === t).value;
  return { y: +g("year"), m: +g("month"), d: +g("day"), h: +g("hour"), mi: +g("minute"), s: +g("second"), wd: g("weekday") };
}
function etMidnight(ms) { const p = etParts(ms); return ms - ((p.h * 60 + p.mi) * 60 + p.s) * 1000 - (ms % 1000); }
/** "2026-10-27T15:00" (ET) → epoch ms. Finds the UTC offset for that calendar day. */
function etToMs(local) {
  const [date, time = "00:00"] = local.split("T");
  const guess = Date.parse(`${date}T${time}:00Z`);
  const p = etParts(guess);
  const localAsUtc = Date.parse(`${p.y}-${String(p.m).padStart(2, "0")}-${String(p.d).padStart(2, "0")}T${String(p.h).padStart(2, "0")}:${String(p.mi).padStart(2, "0")}:00Z`);
  return guess - (localAsUtc - guess);
}
const sameDay = (a, b) => etMidnight(a) === etMidnight(b);
const dayKey = ms => etMidnight(ms);

/* ---- unify everything into one list ---- */
function allItems() {
  const n = now(), start = etMidnight(n) - 7 * D, end = start + 28 * D, out = [];
  for (const i of state.items) if (i.isDue) {
    const ms = Date.parse(i.due);
    if (ms >= start && ms <= end) out.push({ kind: "deadline", title: i.title, course: i.course, start: ms, end: ms, link: i.link, type: i.kind, desc: i.description });
  }
  const sc = state.schedule || {};
  for (const c of sc.classes || []) for (let d = start; d < end; d += D) {
    const p = etParts(d + 12 * H);
    if (!c.days.includes(p.wd)) continue;
    const date = `${p.y}-${String(p.m).padStart(2, "0")}-${String(p.d).padStart(2, "0")}`;
    out.push({ kind: "class", title: code(c.course), course: c.course, start: etToMs(`${date}T${c.start}`), end: etToMs(`${date}T${c.end}`), location: c.location, sample: c.sample });
  }
  for (const m of sc.meetings || []) out.push({ kind: "meeting", title: m.title, course: m.course, start: etToMs(m.start), end: m.end ? etToMs(m.end) : etToMs(m.start) + H, location: m.location, note: m.note, sample: m.sample });
  for (const e of sc.events || []) {
    out.push({ kind: "event", title: e.title, start: etToMs(e.start), end: e.end ? etToMs(e.end) : etToMs(e.start) + 2 * H, location: e.location, link: e.link, note: e.note, sample: e.sample, milestone: e.milestone });
    if (e.milestone) out.push({ kind: "deadline", title: e.milestone.title, course: e.title, start: etToMs(e.milestone.at), end: etToMs(e.milestone.at), link: e.link, type: "milestone" });
  }
  return out.sort((a, b) => a.start - b.start);
}
const matchesQ = i => { const q = $("q").value.trim().toLowerCase(); return !q || `${i.title} ${i.course || ""} ${i.location || ""} ${i.note || ""}`.toLowerCase().includes(q); };
const visible = i => (!kindFilter || i.kind === kindFilter) && matchesQ(i);

function urgency(ms) { const h = (ms - now()) / H; return h < 24 ? 1 : h < 72 ? 2 : 3; }
function leftTxt(ms) {
  const h = (ms - now()) / H;
  if (h < 0) return "past";
  if (h < 1) return `${Math.max(1, Math.round(h * 60))} min`;
  if (h < 24) return `${Math.round(h)} h`;
  return `${Math.round(h / 24)} d`;
}
const pip = ms => { const u = urgency(ms); return `<span class="pip u${u}">${u === 1 ? "Due in " + leftTxt(ms) : u === 2 ? leftTxt(ms) + " left" : leftTxt(ms)}</span>`; };
const KICON = {
  deadline: '<path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/>',
  class: '<path d="M4 7l8-4 8 4-8 4z"/><path d="M6 10v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',
  meeting: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 20c0-2.5 1.5-4.5 4-4.5"/>',
  event: '<path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9-4.3-4.1 5.9-.8z"/>'
};
const kicon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${KICON[k]}</svg>`;

/* ---- renderers ---- */
function renderHero(items) {
  const n = now(), p = etParts(n);
  $("kicker").textContent = fmt(n, { weekday: "long", month: "long", day: "numeric" });
  const g = p.h < 5 ? "Still up" : p.h < 12 ? "Good morning" : p.h < 18 ? "Good afternoon" : "Good evening";
  $("greeting").innerHTML = `${g}, <span>Lee</span>.`;
  const wk = items.filter(i => i.end >= n && i.start < n + 7 * D);
  const c = k => wk.filter(i => i.kind === k).length;
  const dl = wk.filter(i => i.kind === "deadline");
  const tonight = dl.filter(i => urgency(i.start) === 1).length;
  $("summary").textContent = `${dl.length} deadline${dl.length === 1 ? "" : "s"}, ${c("class")} classes, ${c("meeting")} meeting${c("meeting") === 1 ? "" : "s"} and ${c("event")} event${c("event") === 1 ? "" : "s"} in the next 7 days.` + (tonight ? ` ${tonight} due within 24 hours.` : " Nothing due in the next 24 hours.");
  const next = items.find(i => i.start >= n && i.link);
  const a = $("openNext"); if (next) { a.href = next.link; a.textContent = `Next: ${next.title} →`; a.hidden = false; } else a.hidden = true;
  $("stats").innerHTML = [["deadline", "Deadlines", dl.length], ["class", "Classes", c("class")], ["meeting", "Meetings", c("meeting")], ["event", "Events", c("event")]]
    .map(([k, l, v]) => `<button class="stat ${kindFilter === k ? "on" : ""}" data-kind="${k}" data-filter="${k}"><span class="dot">${kicon(k)}</span><span><span class="num">${v}</span><small>${l} · 7 days</small></span></button>`).join("");
}

function itemHtml(i) {
  const u = i.kind === "deadline" ? urgency(i.start) : 0;
  const when = i.kind === "deadline" ? `${timeOf(i.start)}<small>due</small>` : i.ongoing ? `Ongoing<small>until ${fmt(i.end, { weekday: "short" })} ${timeOf(i.end)}</small>` : `${timeOf(i.start)}<small>${timeOf(i.end)}</small>`;
  const sub = [i.course && i.kind !== "class" ? code(i.course) : "", i.kind === "class" ? courseName(i.course) : "", i.location, i.type && i.type !== "milestone" ? i.type : ""].filter(Boolean).join(" · ");
  return `<div class="item ${u === 1 ? "urgent" : ""}" data-kind="${i.kind}">
    <div class="time">${when}</div>
    <div class="body"><h4>${esc(i.title)}${i.sample ? '<span class="sample">sample</span>' : ""}</h4><p>${esc(sub)}</p></div>
    <div class="side"><span class="kind">${i.kind}</span>${u ? pip(i.start) : ""}</div>
    ${i.link ? `<a class="cover" href="${esc(i.link)}" target="_blank" rel="noopener" aria-label="${esc(i.title)}"></a>` : ""}</div>`;
}
function renderTimeline(items) {
  const n = now(), today = etMidnight(n);
  const days = [[today, "Today"], [today + D, "Tomorrow"], [today + 2 * D, fmt(today + 2 * D + 12 * H, { weekday: "long" })]];
  let html = "";
  for (const [d, label] of days) {
    const ongoing = items.filter(i => visible(i) && i.kind === "event" && i.start < d && i.end > Math.max(d, n)).map(i => ({ ...i, ongoing: true }));
    const list = items.filter(i => visible(i) && dayKey(i.start) === d && (i.end >= n || d > today));
    html += `<div class="tl-day"><h3><b>${label}</b> ${fmt(d + 12 * H, { month: "short", day: "numeric" })}</h3>${[...ongoing, ...list].map(itemHtml).join("") || `<p class="empty">Nothing scheduled.</p>`}</div>`;
  }
  $("timeline").innerHTML = html;
}
function renderFocus(items) {
  const i = items.find(x => x.kind === "deadline" && x.start >= now() && visible(x));
  if (!i) { $("focus").innerHTML = `<div class="kicker">Next deadline</div><h2>All clear.</h2><p class="sub">No deadlines ahead.</p>`; return; }
  const orders = (i.desc || "").split("\n").map(l => l.trim()).filter(l => l && !/https?:\/\//.test(l) && !/^(Assignments|Discussions|Quizzes|Materials|Modules):$/i.test(l)).join("\n");
  $("focus").innerHTML = `<div class="kicker">Next deadline</div><h2>${esc(i.title)}</h2><p class="sub">${esc(code(i.course))} · ${esc(fmt(i.start, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}</p>
    <div class="cd" id="cd" data-due="${i.start}"></div>
    ${i.link ? `<a class="btn" href="${esc(i.link)}" target="_blank" rel="noopener">${i.type === "milestone" ? "Open event page" : "Open in Brightspace"} →</a>` : ""}
    ${orders ? `<p class="orders">${esc(orders)}</p>` : ""}
    ${afterHtml(items, i)}`;
  tick();
}
function afterHtml(items, cur) {
  const rest = items.filter(x => x.kind === "deadline" && x !== cur && x.start >= now() && visible(x)).slice(0, 3);
  if (!rest.length) return "";
  return `<div class="after"><div class="kicker">After that</div>${rest.map(x => `<div class="after-row"><span>${esc(x.title)}<small>${esc(code(x.course))}</small></span><b>${esc(fmt(x.start, { weekday: "short", month: "short", day: "numeric" }))}</b></div>`).join("")}</div>`;
}
function tick() {
  const el = $("cd"); if (!el) return;
  let s = Math.max(0, Math.floor((+el.dataset.due - now()) / 1000));
  const d = Math.floor(s / 86400); s %= 86400; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
  el.innerHTML = [[d, "days"], [h, "hrs"], [m, "min"], [s, "sec"]].map(([v, l]) => `<div><b>${String(v).padStart(2, "0")}</b><small>${l.toUpperCase()}</small></div>`).join("");
}
function renderWeekStrip(items) {
  const today = etMidnight(now());
  const range = `${fmt(today + 12 * H, { month: "short", day: "numeric" })} – ${fmt(today + 6 * D + 12 * H, { month: "short", day: "numeric" })}`;
  $("weekRange").textContent = range; $("weekRange2").textContent = range;
  $("weekstrip").innerHTML = Array.from({ length: 7 }, (_, k) => {
    const d = today + k * D, list = items.filter(i => visible(i) && dayKey(i.start) === d);
    return `<div class="wd ${k === 0 ? "today" : ""}"><small>${fmt(d + 12 * H, { weekday: "short" })}</small><b>${etParts(d + 12 * H).d}</b><div class="dots">${list.map(i => `<i data-kind="${i.kind}" title="${esc(i.title)}"></i>`).join("")}</div></div>`;
  }).join("");
}
function dlHtml(i) {
  const total = 14 * D, elapsed = Math.min(1, Math.max(0, 1 - (i.start - now()) / total));
  return `<div class="item" data-kind="deadline">
    <div class="body"><h4>${esc(i.title)} <span class="course-tag">${esc(code(i.course))}</span></h4><p>${esc(i.type === "milestone" ? i.course : courseName(i.course))}${i.type && i.type !== "milestone" ? " · " + esc(i.type) : ""}</p>
      <div class="bar"><i style="width:${Math.round(elapsed * 100)}%"></i></div></div>
    <div class="date">${esc(fmt(i.start, { weekday: "short", month: "short", day: "numeric" }))}<small>${timeOf(i.start)}</small><div style="margin-top:6px">${pip(i.start)}</div></div>
    ${i.link ? `<a class="cover" href="${esc(i.link)}" target="_blank" rel="noopener" aria-label="${esc(i.title)}"></a>` : ""}</div>`;
}
function renderDeadlines(items) {
  const list = items.filter(i => i.kind === "deadline" && i.start >= now() && visible(i));
  $("deadlines").innerHTML = list.slice(0, 5).map(dlHtml).join("") || `<p class="empty">No deadlines ahead.</p>`;
  $("deadlinesAll").innerHTML = list.map(dlHtml).join("") || `<p class="empty">No deadlines ahead.</p>`;
}
function renderAgenda(items) {
  const list = items.filter(i => (i.kind === "meeting" || i.kind === "event") && i.end >= now() && visible(i)).slice(0, 6);
  $("agCount").textContent = `${list.length} upcoming`;
  $("agenda").innerHTML = list.map(i => `<div class="row" data-kind="${i.kind}">
      <div class="datebox"><small>${fmt(i.start, { month: "short" })}</small><b>${etParts(i.start).d}</b></div>
      <div><h4>${esc(i.title)}<span class="kind">${i.kind}</span>${i.sample ? '<span class="sample">sample</span>' : ""}</h4>
        <p>${esc(fmt(i.start, { weekday: "short" }))} ${timeOf(i.start)} – ${sameDay(i.start, i.end) ? "" : esc(fmt(i.end, { weekday: "short" })) + " "}${timeOf(i.end)}${i.location ? " · " + esc(i.location) : ""}</p>
        ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}
        ${i.milestone ? `<div class="mile">⏱ ${esc(i.milestone.title)} · ${esc(fmt(etToMs(i.milestone.at), { weekday: "short", hour: "numeric", minute: "2-digit" }))}</div>` : ""}
      </div>${i.link ? `<a class="cover" href="${esc(i.link)}" target="_blank" rel="noopener" aria-label="${esc(i.title)}" style="position:absolute;inset:0"></a>` : ""}</div>`).join("") || `<p class="empty">No meetings or events coming up.</p>`;
}
function renderWeekView(items) {
  const today = etMidnight(now()), H0 = 8, H1 = 20, PX = 60;
  let head = `<div class="hd"></div>`, body = `<div class="hours">${Array.from({ length: H1 - H0 + 1 }, (_, k) => `<span style="top:${k * PX}px">${(H0 + k) % 12 || 12}${H0 + k < 12 ? "a" : "p"}</span>`).join("")}</div>`;
  let allday = `<div class="allday"></div>`;
  const cols = [];
  for (let k = 0; k < 7; k++) {
    const d = today + k * D, list = items.filter(i => visible(i) && (dayKey(i.start) === d || (i.kind === "event" && i.start < d && i.end > d)));
    head += `<div class="hd ${k === 0 ? "today" : ""}">${fmt(d + 12 * H, { weekday: "short" })}<b>${etParts(d + 12 * H).d}</b></div>`;
    const multi = list.filter(i => i.kind === "event" && i.end - i.start > 12 * H);
    allday += `<div class="allday">${multi.map(i => `<span data-kind="event">${esc(i.title)}</span>`).join("")}</div>`;
    let col = "";
    for (const i of list) {
      if (multi.includes(i)) continue;
      const p = etParts(i.start), top = ((p.h + p.mi / 60) - H0) * PX;
      if (top < -PX || top > (H1 - H0) * PX) continue;
      if (i.kind === "deadline") col += `<div class="pin u${urgency(i.start)}" style="top:${Math.max(0, top - 10)}px" title="${esc(i.title)}">${esc(i.title)}</div>`;
      else col += `<div class="blk" data-kind="${i.kind}" style="top:${top}px;height:${Math.max(22, (i.end - i.start) / H * PX - 2)}px" title="${esc(i.title)}">${esc(i.title)}<small>${esc(i.location || "")}</small></div>`;
    }
    cols.push(`<div class="col">${col}</div>`);
  }
  $("wk").innerHTML = head + allday + body + cols.join("");
}
function renderCourses(items) {
  const m = new Map();
  for (const i of state.items) if (/^[A-Z]{3}\s\d{3}/.test(i.course) && i.isDue && Date.parse(i.due) >= now()) {
    const e = m.get(i.course) || { n: 0, next: null }; e.n++; if (!e.next || Date.parse(i.due) < Date.parse(e.next.due)) e.next = i; m.set(i.course, e);
  }
  const cls = (state.schedule?.classes || []);
  $("courses").innerHTML = [...m].sort().map(([c, e]) => {
    const k = cls.find(x => x.course === c);
    return `<div class="course"><span class="n">${e.n}</span><h3>${esc(code(c))}</h3><p>${esc(courseName(c))}${k ? ` · ${k.days.join("/")} ${k.start}–${k.end}` : ""}</p>
      <div class="next">Next: <b>${esc(e.next.title)}</b> · ${esc(fmt(Date.parse(e.next.due), { weekday: "short", month: "short", day: "numeric" }))}</div></div>`;
  }).join("") || `<p class="empty">No courses with upcoming work.</p>`;
}

function render() {
  const items = allItems();
  renderHero(items); renderTimeline(items); renderFocus(items); renderWeekStrip(items);
  renderDeadlines(items); renderAgenda(items); renderWeekView(items); renderCourses(items);
}
async function load() {
  try { state = await (await fetch("/api/state")).json(); clockOffset = Date.parse(state.now) - Date.now(); } catch {}
  render();
}
function go(view) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === view));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-" + view);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) go(t.dataset.view); });
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); }
  const f = e.target.closest("[data-filter]"); if (f) { kindFilter = kindFilter === f.dataset.filter ? null : f.dataset.filter; render(); }
});
$("q").addEventListener("input", render);
load(); setInterval(tick, 1000); setInterval(load, 60_000);
</script>
